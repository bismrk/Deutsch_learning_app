services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deutsch_learning}

  backend:
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/deutsch_learning}
      BOT_TOKEN: ${BOT_TOKEN:-dev-bot-token-placeholder}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      DAILY_LLM_LIMIT: ${DAILY_LLM_LIMIT:-50}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  scheduler:
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/deutsch_learning}
      BOT_TOKEN: ${BOT_TOKEN:-dev-bot-token-placeholder}
    volumes:
      - ./backend/app:/app/app

  bot:
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_TOKEN: ${BOT_TOKEN:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
      MINIAPP_URL: ${MINIAPP_URL:-}
    volumes:
      - ./bot/bot_app:/app/bot_app

  caddy:
    ports: !override
      - "127.0.0.1:${CADDY_HTTP_PORT:-8080}:80"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
